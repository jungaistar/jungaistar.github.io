cv:
  name: 정동엽 (Jeong Dong-Yeop)
  label: 커리어 전략가 · 미래예측 전문가 · 대학 겸임교수
  email: radical8566@gmail.com
  phone: 010-7315-4585
  website: https://jdy.dreamitbiz.com
  location: 대한민국
  image: ""
  summary: "'인간중심 AI 기본사회'로의 이행을 설계하는 커리어 전략가입니다. 대학 겸임교수로서 생성형 AI 강의와 청소년·청년·성인·베이비부머의 상담, 경력 재설계·전직·면접 코칭을 지원합니다. 미래예측 전문가로서 20년간의 IT 교육정보화·이러닝 구축 경험을 기반으로 AI 시대의 직업 패러다임 전환을 견인하고 있습니다."

  social_networks:
    - network: GitHub
      username: jungaistar

  sections:
    학력:
      - institution: 경기대학교 일반대학원
        location: 대한민국
        area: 직업학과
        studyType: 박사과정 수료
        end_date: 2026-05

      - institution: 가천대학교 경영대학원
        location: 대한민국
        area: 고용 및 직업상담학과
        studyType: 석사
        end_date: 2014-08

      - institution: 국제문화대학원대학교
        location: 대한민국
        area: 학습코칭 전공
        studyType: 교육학석사
        end_date: 2012-02

      - institution: 교육과학기술부
        location: 대한민국
        area: 사회복지사 과정 졸업
        studyType: 행정학 학사
        end_date: 2012-02

      - institution: 부산외국어대학교
        location: 대한민국
        area: 컴퓨터공학
        studyType: 공학사
        end_date: 1994-08

    경력:
      - company: AI미래직업연구소
        position: 소장
        summary: 미래예측 기반 커리어 경력설계 및 전직지원 전문기관 운영
        highlights:
          - 커리어 경력설계 · 전직지원 · 이력서 · 면접 코칭
          - 창업 · 창직 컨설팅 및 생성형 AI 리터러시 교육
          - 대학생 IT 분야 취업·진로지도, 사회공헌(NGO·NPO) 교육 및 기금 모금 활동 교육

      - company: 키다리진로직업협동조합
        position: 이사장 (대표)
        summary: 진로·직업 교육 협동조합 운영

      - company: 사단법인 기본사회
        position: AI기본사회 교육센터장
        summary: 인간중심 AI 기본사회로의 이행을 위한 교육 설계 및 운영

      - company: 동아방송예술대학교
        position: 겸임교수 (교양융합학부)
        start_date: 2017
        summary: 1인 예술과 창업, 문화예술콘텐츠 창업, 창업실무, 취업과 경력개발, NCS기초

      - company: 한국기술교육대학교 능력개발원
        position: 전임교수
        start_date: 2016
        end_date: 2020
        summary: 「4차 산업혁명시대 일과 직업의 변화」 전임교수

      - company: 한국뉴욕주립대학교
        position: Futures Master & Futures Coach
        summary: 미래학 기반 전략컨설팅 및 코칭

      - company: 서울시 산업진흥원
        position: 신직업 자문위원 · 창업닥터
        summary: 4차산업 신직업 자문, IT 플랫폼 전문컨설턴트, 창업전문위원, Edu Tool Kit 디자이너, 신직업 전문코치

      - company: 아시아미래인재연구소
        position: 실장 (전)
        summary: 미래인재 육성 및 미래예측 연구

      - company: 와우캠프
        position: 대표 강사
        summary: 경기 · 인천 진로지도 특강

      - company: IT 분야 20년
        position: 교육정보화 · 이러닝 구축
        summary: 학사정보시스템 · 이러닝시스템 구축 설계, 교육정보화 기술영업

    핵심역량:
      - title: 미래 진로지도 · 창업 · 창직 · 빅데이터 · 전직지원 강의
        summary: 대학·공공기관·기업 대상 미래직업 패러다임 전환 교육
      - title: 직업 · 진로 · 창업 · 학습 분야 강의
        summary: 전 연령층 직업상담 및 전직 강의, 미래학 기반 전략컨설팅 및 진로지도(전략컨설팅·비전수립)
      - title: 자기주도적 학습코칭 · 학부모 코칭
        summary: 감정코칭 및 자녀 진로지도
      - title: 파워포인트 제안 PM · 프리젠테이션 기획 및 강의
      - title: 직무스트레스 관리 워크샵 · 강의
        summary: NLP 기반 스트레스 조절
      - title: 시뮬레이션형 창업 컨설팅
        summary: 미래예측기법 기반 · 미래전략 컨설턴트 및 비전코칭

    주요 강의 실적:
      - title: 전남대학교
        summary: 생성형 AI ADVANCED 과정(교수설계, 교수 대상) · 생성형 AI 기반 문서/인사행정 실무자동화 과정(행정직 대상)
      - title: 동신대학교
        summary: 클로드 기반 교수 설계 강의 (교수 대상)
      - title: 조선대학교
        summary: 클로드를 활용한 업무자동화 강의 (교수 대상)
      - title: SKALA 4기 AI 캠퍼스 · K-뉴딜 과정
        summary: 실기 강사
      - title: K-Digital 양성과정
        summary: 빅데이터 개론 및 데이터 전처리 강의
      - title: 제이엠커리어 · 인저어스
        summary: 4차 산업혁명과 일자리 변화, 전직지원사업 강의
      - title: 8개 교육지원청 (금산·논산·음성·서산·공주 등)
        summary: 「4차 산업혁명과 진로지도」 특강

    자격:
      - title: 직업심리전문가
        summary: 한국고용정보원 (청소년 · 대학생 · 성인 부문) · 청소년 온라인 직업상담원 · 온라인 직업심리전문가
      - title: 희망취업프로그램 · 취업성공패키지 운영자
        summary: CAP+ 진행자 · 사무직 베이비부머 퇴직설계프로그램 진행자
      - title: 미래학 마스터 6학기 졸업
        summary: 한국뉴욕주립대 아시아미래인재연구소 · Futures Master & Futures Coach
      - title: 미래준비학교 Master Coach
        summary: 미래전략 컨설턴트 및 비전코칭
      - title: 신직업 전문코칭 · Edu Tool Kit 디자이너 · IT 플랫폼 컨설턴트
        summary: 서울시 산업진흥원
      - title: 제3기 희망설계아카데미
        summary: 서울시 청년 창업닥터
      - title: 커리어 컨설턴트
        summary: 삼성SDS 멀티캠퍼스
      - title: 하프타임 강사
        summary: 하프타임코리아 · 인생전환 설계
      - title: 사회복지사 2급 (보건복지부)
      - title: 평생교육사 2급 (교육과학기술부)
      - title: 외국인을 위한 한국어교사 2급 (문화관광부)
      - title: 직업훈련교사 3급 (고용노동부)
        summary: 마케팅 / 정보기술전략·계획(빅데이터)
      - title: 프레디저 전문강사 (한국프레디저)
      - title: 국제공인 NLP Practitioner
      - title: 모금전문가 수료 (희망제작소)
      - title: 직무스트레스 관리 강사 (러너코리아)

    저서:
